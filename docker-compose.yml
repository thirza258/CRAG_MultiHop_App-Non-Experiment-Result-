services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Named tag so the worker can reuse this exact image instead of
    # building (and storing) a second identical copy.
    image: cragreader-backend:latest
    container_name: crag_backend
    ports:
      - "8051:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      - MODEL_CACHE_DIR=/app/models
    volumes:
      - ./backend/models:/app/models
      - media:/app/media
      - vectorstores:/app/vector_stores
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "ragreader.asgi:application"]
    restart: unless-stopped
    healthcheck:
      # Uses the health endpoint which checks database + Redis connectivity,
      # not just whether daphne accepts TCP connections.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  worker:
    # Same image as the backend — built once by the backend service.
    image: cragreader-backend:latest
    container_name: crag_worker
    command: ["celery", "-A", "ragreader", "worker", "-l", "info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      backend:
        # Wait until the backend finished migrations + downloads, so the
        # two containers never run init steps concurrently.
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - MODEL_CACHE_DIR=/app/models
      # The backend container owns migrations, dataset insert and model
      # download — the worker only waits for the shared model volume.
      - SKIP_INIT=1
    volumes:
      - ./backend/models:/app/models
      - media:/app/media
      - vectorstores:/app/vector_stores
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "ragreader", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crag_frontend
    ports:
      - "5151:5176"
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./frontend/.env
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6351:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  chromadb:
    image: chromadb/chroma:latest
    container_name: crag_chromadb
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["http://localhost:5176","http://localhost:3000","http://localhost:5151"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: crag_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crag_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d crag_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  media:
  vectorstores:
  chroma_data:
