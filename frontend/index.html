    <!--
      Static metadata describes the landing page ("/"), which is what crawlers
      that do not execute JavaScript (Facebook, X, LinkedIn, Slack) will read.
      Per-route titles/descriptions are set at runtime by src/lib/seo.ts —
      keep the "/" values there in sync with the tags below.
    -->
    <title>Corrective Multi-Hop RAG with Reranking | CRAG MultiHop RAG</title>
    <meta
      name="description"
      content="Chat with your PDFs, URLs and notes. Dense + BM25 retrieval, self-grading Corrective RAG, up to 3 query hops, local reranking and faithfulness scores on every answer."
    />
    <meta
      name="keywords"
      content="CRAG, Corrective RAG, Multi-Hop RAG, Hybrid Retrieval, BM25, Local Reranking, Jina Reranker, RAGAs Faithfulness, LLM Hallucination Reduction, Vector Search, ChromaDB"
    />
    <meta name="author" content="CRAG MultiHop RAG Team" />
    <link rel="canonical" href="https://crag.nevatal.tech/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#240091" />
    <meta name="color-scheme" content="light" />
    <script>
      (() => {
        function registerWebMcpTools() {
          if (!('modelContext' in navigator) || !navigator.modelContext) return;
          try {
            const controller = new AbortController();
            navigator.modelContext.registerTool({
              name: 'search_crag_multihop',
              title: 'Search CRAG MultiHop',
              description: 'Search documents, run multi-hop questions, and view verified answers on CRAG.',
              inputSchema: {
                type: 'object',
                properties: {
                  query: { type: 'string', description: 'Question or search query for multi-hop retrieval' }
                },
                required: ['query']
              },
              execute: async ({ query }) => {
                return {
                  content: [{ type: 'text', text: `Results for ${query}: Visit https://crag.nevatal.tech` }]
                };
              }
            }, { signal: controller.signal });
          } catch (e) {}
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', registerWebMcpTools);
        } else {
          registerWebMcpTools();
        }
      })();
    </script>
