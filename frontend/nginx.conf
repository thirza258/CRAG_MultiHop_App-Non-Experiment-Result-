map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    listen 5176;
    server_name localhost;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location = /index.md {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header x-markdown-tokens "420" always;
    }

    location / {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        add_header Vary "Accept" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_read_timeout 360s;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        text/markdown
        image/svg+xml;

    # PWA: service worker and manifest must revalidate on every load so
    # new deploys propagate — the 1y immutable rule below must not apply.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
