map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    listen 5176;
    server_name localhost;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location = /index.md {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header x-markdown-tokens "420" always;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
    }

    # RFC 9727 API Catalog
    location = /.well-known/api-catalog {
        default_type "application/linkset+json; charset=utf-8";
        add_header Content-Type "application/linkset+json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Auth.md discovery
    location = /auth.md {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # RFC 9728 OAuth Protected Resource Metadata
    location = /.well-known/oauth-protected-resource {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # OAuth / OIDC Discovery & Bot Auth
    location ~* ^/\.well-known/(openid-configuration|oauth-authorization-server|agent-card\.json|jwks\.json|http-message-signatures-directory)$ {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Agent Skills Discovery
    location = /.well-known/agent-skills/index.json {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SEP-1649 MCP Server Cards
    location ~* ^/\.well-known/mcp/.*\.json$ {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /.well-known/mcp.json {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Skill markdown artifacts
    location /skills/ {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # OpenAPI schema & docs proxies
    location = /api/openapi.json {
        proxy_pass http://backend:8000/api/schema/?format=json;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /api/docs {
        proxy_pass http://backend:8000/api/docs/;
        proxy_set_header Host $host;
    }

    location / {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
        add_header Vary "Accept" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
        add_header Vary "Accept" always;
    }

    location /api/ {
        proxy_read_timeout 360s;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        text/markdown
        application/linkset+json
        image/svg+xml;

    # PWA: service worker and manifest must revalidate on every load so
    # new deploys propagate — the 1y immutable rule below must not apply.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
