name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The suite must pass with no external service and no credentials:
      # SQLite instead of PostgreSQL, and every network call mocked.
      DEVELOPMENT_MODE: "true"
      DEBUG: "false"
      SECRET_KEY: ci-secret-key-not-used-in-production
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      LANGSMITH_TRACING: "false"
      # Point the client config at hosts that do not exist — any test that
      # forgot to mock a service will fail fast instead of hanging.
      CHROMA_HOST: chroma-unreachable.invalid
      CHROMA_PORT: "8000"
      REDIS_HOST: redis-unreachable.invalid
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis-unreachable.invalid:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Same two-step install as backend/Dockerfile: CPU-only torch first, so
      # pip never pulls the multi-gigabyte CUDA build as a transitive dep.
      - name: Install CPU-only torch
        run: pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # sparse_rag imports nltk stopwords at module import time.
      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt'); nltk.download('punkt_tab')"

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Verify migrations are complete
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        working-directory: backend
        run: python manage.py test --verbosity 2

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck too.
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Test chat connection lifecycle
        working-directory: frontend
        run: npm test

      # Non-blocking: the repo has pre-existing lint errors that predate CI.
      # Drop continue-on-error once they are cleaned up so lint becomes a gate.
      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
